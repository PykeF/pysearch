[project]
name = "pysearch"
version = "0.1.0"
description = "An educational distributed search engine built from scratch in Python."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx2>=2.10.0",
    "numpy>=2.5.2",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
semantic = [
    "model2vec>=0.9.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests needing the real embedding model are excluded by default, so a plain
# `uv run pytest` never downloads a model or touches the network. Run them with
# `uv run --extra semantic pytest -m semantic_model`.
addopts = "--strict-markers --strict-config -m 'not semantic_model'"
markers = [
    "semantic_model: requires the real embedding model and the 'semantic' extra",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # pep8 naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplification
    "RUF",  # ruff-specific rules
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
