# A three-shard cluster plus a coordinator, for reproducible local development.
#
# Compose is a deployment mechanism here, not the distributed system: routing,
# fan-out, merging and the failure policy are all plain Python and are exercised
# by the test suite and by scripts/run_cluster.py without containers.
#
#   docker compose up --build
#   curl localhost:8000/ready
#
# Each shard gets its own volume. Two shards pointed at one database would share
# a corpus instead of partitioning it, which is the opposite of sharding.

x-node: &node
  build: .
  image: pysearch:local
  environment: &node-env
    PYSEARCH_LOG_LEVEL: INFO
    PYSEARCH_SHARD_COUNT: "3"
    PYSEARCH_STORAGE_PATH: /data/pysearch.db
  restart: unless-stopped

services:
  shard-0:
    <<: *node
    environment:
      <<: *node-env
      PYSEARCH_APP_NAME: pysearch-shard-0
      PYSEARCH_NODE_ROLE: shard
      PYSEARCH_SHARD_ID: "0"
    volumes:
      - shard-0-data:/data
    healthcheck: &healthcheck
      # No curl in the slim image, and adding one just for a probe is not worth
      # the surface; the interpreter is already here.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready').status==200 else 1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  shard-1:
    <<: *node
    environment:
      <<: *node-env
      PYSEARCH_APP_NAME: pysearch-shard-1
      PYSEARCH_NODE_ROLE: shard
      PYSEARCH_SHARD_ID: "1"
    volumes:
      - shard-1-data:/data
    healthcheck: *healthcheck

  shard-2:
    <<: *node
    environment:
      <<: *node-env
      PYSEARCH_APP_NAME: pysearch-shard-2
      PYSEARCH_NODE_ROLE: shard
      PYSEARCH_SHARD_ID: "2"
    volumes:
      - shard-2-data:/data
    healthcheck: *healthcheck

  coordinator:
    <<: *node
    environment:
      <<: *node-env
      PYSEARCH_APP_NAME: pysearch-coordinator
      PYSEARCH_NODE_ROLE: coordinator
      PYSEARCH_SHARD_URLS: http://shard-0:8000,http://shard-1:8000,http://shard-2:8000
      PYSEARCH_REQUEST_TIMEOUT: "2.0"
      PYSEARCH_CONNECT_TIMEOUT: "1.0"
    ports:
      - "8000:8000"
    depends_on:
      shard-0:
        condition: service_healthy
      shard-1:
        condition: service_healthy
      shard-2:
        condition: service_healthy

# The coordinator has no volume: it owns no documents, which is why losing it
# loses nothing.
volumes:
  shard-0-data:
  shard-1-data:
  shard-2-data:
